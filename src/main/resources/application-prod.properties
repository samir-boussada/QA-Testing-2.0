# ========================================================
# NovaShop E-Commerce - Hostinger Production Profile (MySQL)
# Activate with: java -jar novashop-ecommerce.jar --spring.profiles.active=prod
# ========================================================
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/novashop_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=u_novashop_admin
spring.datasource.password=CHANGE_THIS_TO_HOSTINGER_DB_PASSWORD

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=false
