# ========================================================
# NovaShop E-Commerce - Configuration
# ========================================================
server.port=8080
spring.application.name=novashop-ecommerce

# Default Local Profile: In-memory H2 with auto-schema creation for immediate local testing
spring.datasource.url=jdbc:h2:mem:novashop_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Security Session Configuration
server.servlet.session.timeout=60m
server.servlet.session.cookie.http-only=true

# Static resource handling
spring.web.resources.static-locations=classpath:/static/
